[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-paper"
version = "1.1.0"
description = "Paper forward-test that mirrors skilled Polymarket wallets under five exit rules."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "polymarket-paper contributors" }]
keywords = ["polymarket", "prediction-markets", "copytrading", "paper-trading", "research"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.scripts]
copybot = "copybot:main"
copytrade = "copytrade:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools]
py-modules = ["copybot", "copytrade", "paper_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
# Tests mock the Polymarket HTTP layer — no network, no keys, fast.
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
