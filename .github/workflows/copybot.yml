name: copybot-tick

# Forward-tests copying vetted traders. tick (detect fresh buys) is fast; resolve
# (settle/mark) is bounded per run. Self-healing — missed runs lose nothing.
on:
  schedule:
    - cron: "11 * * * *"   # two offset triggers so a dropped GitHub run never leaves a
    - cron: "41 * * * *"   # full-hour gap; concurrency queues them for near-continuous cover
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: copybot
  cancel-in-progress: false

jobs:
  copybot:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tick every 3 min for ~45 min, then resolve (headroom for commit)
        run: |
          for i in $(seq 1 16); do
            echo "--- tick $i/16 ($(date -u +%T)) ---"
            python3 copybot.py tick || true
            [ "$i" -lt 16 ] && sleep 180
          done
          timeout 360 python3 copybot.py resolve || true
          python3 copybot.py report || true
      - name: persist
        run: |
          git config user.name "copybot"
          git config user.email "bot@users.noreply.github.com"
          git add copybot.db
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "copybot tick $(date -u +%FT%TZ)"
            # resilient push: rebase + retry so one flaky push doesn't lose the hour
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main || true
              git push && break || { echo "push attempt $attempt failed, retrying"; sleep 5; }
            done
          fi
