name: copybot-tick

# Forward-tests copying vetted traders. tick (detect fresh buys) is fast; resolve
# (settle/mark) is bounded per run. Self-healing — missed runs lose nothing.
on:
  schedule:
    - cron: "11 * * * *"   # hourly trigger; each run self-loops to tick every 3 min
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: copybot
  cancel-in-progress: false

jobs:
  copybot:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tick every 3 min for ~55 min, then resolve
        run: |
          for i in $(seq 1 18); do
            echo "--- tick $i/18 ($(date -u +%T)) ---"
            python3 copybot.py tick || true
            [ "$i" -lt 18 ] && sleep 180
          done
          python3 copybot.py resolve || true
          python3 copybot.py report
      - name: persist
        run: |
          git config user.name "copybot"
          git config user.email "bot@users.noreply.github.com"
          git add copybot.db
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "copybot tick $(date -u +%FT%TZ)"
            git pull --rebase --autostash origin main || true
            git push
          fi
