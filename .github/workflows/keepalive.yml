name: keepalive

# GitHub Actions cron can silently skip scheduled runs during high load.
# This tiny workflow fires every 30 min and triggers the main copybot via
# workflow_dispatch — dispatch is more reliable than bare cron.
on:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: trigger copybot
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/copybot.yml/dispatches \
            -d '{"ref":"main"}'
